<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audi | Login</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <!-- 1. The Ultimate Fallback (Placed first for old browsers) -->
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />

    <!-- 2. Modern Browsers & High-Res Screens -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon-16x16.png"
    />

    <!-- 3. Apple Devices -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/apple-touch-icon.png"
    />

    <!-- 4. PWA / Android / Windows -->
    <link rel="manifest" href="images/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#dfe3e5",
              "on-secondary-container": "#616567",
              "surface-container-highest": "#e2e2e2",
              "secondary-fixed": "#dfe3e5",
              "inverse-surface": "#2f3131",
              "surface-dim": "#dadada",
              error: "#ba1a1a",
              "surface-container-high": "#e8e8e8",
              "primary-fixed-dim": "#c6c6c6",
              "on-surface": "#1a1c1c",
              outline: "#7e7576",
              "on-error": "#ffffff",
              "on-secondary-fixed": "#181c1e",
              "on-background": "#1a1c1c",
              "on-tertiary": "#ffffff",
              "tertiary-fixed-dim": "#ffb3b3",
              "error-container": "#ffdad6",
              "on-surface-variant": "#4c4546",
              "surface-container-lowest": "#ffffff",
              "surface-variant": "#e2e2e2",
              "surface-bright": "#f9f9f9",
              "secondary-fixed-dim": "#c3c7c9",
              surface: "#f9f9f9",
              "on-primary-container": "#848484",
              "inverse-primary": "#c6c6c6",
              "surface-tint": "#5e5e5e",
              "primary-fixed": "#e2e2e2",
              background: "#f9f9f9",
              "on-secondary": "#ffffff",
              "on-primary": "#ffffff",
              "outline-variant": "#cfc4c5",
              "on-primary-fixed-variant": "#474747",
              "on-tertiary-fixed-variant": "#920022",
              "surface-container": "#eeeeee",
              "on-error-container": "#93000a",
              "tertiary-container": "#400009",
              "on-tertiary-fixed": "#400009",
              "on-secondary-fixed-variant": "#434749",
              secondary: "#5b5f61",
              primary: "#000000",
              "on-tertiary-container": "#f33d52",
              "primary-container": "#1b1b1b",
              "surface-container-low": "#f3f3f3",
              "inverse-on-surface": "#f1f1f1",
              "tertiary-fixed": "#ffdad9",
              tertiary: "#000000",
              "on-primary-fixed": "#1b1b1b",
            },
            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
          },
        },
      };
    </script>

    <style>
      .glass-header {
        background: rgba(243, 243, 243, 0.8);
        backdrop-filter: blur(24px);
      }
    </style>
  </head>

  <body
    class="bg-surface text-on-surface font-body selection:bg-primary selection:text-white min-h-screen flex flex-col"
  >
    <header
      class="glass-header sticky top-0 z-50 border-b border-outline-variant/10"
    >
      <nav
        class="container mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-12">
          <a
            href="index.html"
            class="font-headline text-2xl font-extrabold tracking-tighter"
          >
            Audi
          </a>
        </div>

        <div class="flex items-center gap-6">
          <a
            class="text-sm font-semibold hover:opacity-70 transition-opacity"
            href="register.html"
          >
            Register
          </a>
        </div>
      </nav>
    </header>

    <main class="flex-grow flex items-center justify-center py-16">
      <div class="container max-w-md mx-auto px-6">
        <div class="bg-surface-container-lowest p-8 md:p-10 shadow-sm">
          <div class="text-center mb-8">
            <h1 class="font-headline text-3xl font-bold tracking-tight mb-2">
              Welcome Back
            </h1>
            <p class="text-sm text-on-surface-variant">
              Sign in to your Audi account
            </p>
          </div>

          <!-- Email Login Form -->
          <form id="loginForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-2">Email</label>
              <input
                type="email"
                id="loginEmail"
                required
                class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors"
                placeholder="Enter your email"
              />
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">Password</label>
              <input
                type="password"
                id="loginPassword"
                required
                class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors"
                placeholder="Enter your password"
              />
            </div>

            <div class="text-right">
              <button
                type="button"
                id="forgotPasswordBtn"
                class="text-sm text-primary hover:underline"
              >
                Forgot Password?
              </button>
            </div>

            <div class="g-recaptcha" data-sitekey="6LesAA0tAAAAAMckxbDHbj54f6U8OQdmROs9HyGa"></div>

            <button
              type="submit"
              class="w-full bg-primary text-white py-3 font-semibold hover:opacity-90 transition-opacity"
            >
              Sign In
            </button>
          </form>

          <div id="statusMessageWrap" class="min-h-[24px] mt-4">
            <p
              id="statusMessage"
              class="text-sm text-center min-h-[20px] text-on-surface-variant"
            ></p>
          </div>

          <p class="text-center text-sm text-on-surface-variant mt-8">
            Don't have an account?
            <a
              href="register.html"
              class="font-bold text-primary hover:underline"
            >
              Register
            </a>
          </p>
        </div>
      </div>
    </main>

    <!-- OTP Modal -->
    <div id="otpModal" class="modal hidden fixed inset-0 z-50 items-center justify-center">
      <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
      <div class="relative bg-surface-container-lowest p-8 max-w-md w-full mx-4 shadow-xl z-10">
        <div class="text-center mb-6">
          <h2 class="font-headline text-2xl font-bold">Verify OTP</h2>
          <p class="text-sm text-on-surface-variant mt-2" id="otpMessage">
            Please enter the OTP sent to your email
          </p>
        </div>

        <form id="otpForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">OTP Code</label>
            <input
              type="text"
              id="otpCode"
              required
              maxlength="6"
              class="w-full px-4 py-3 text-center text-2xl tracking-widest border border-outline-variant focus:border-primary focus:outline-none transition-colors"
              placeholder="000000"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-primary text-white py-3 font-semibold hover:opacity-90 transition-opacity"
          >
            Verify OTP
          </button>

          <button
            type="button"
            id="resendOtpBtn"
            class="w-full text-sm text-primary hover:underline"
          >
            Resend OTP
          </button>
        </form>

        <button
          id="closeOtpModal"
          class="absolute top-4 right-4 text-on-surface-variant hover:text-primary"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal hidden fixed inset-0 z-50 items-center justify-center">
      <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
      <div class="relative bg-surface-container-lowest p-8 max-w-md w-full mx-4 shadow-xl z-10">
        <div class="text-center mb-6">
          <h2 class="font-headline text-2xl font-bold">Reset Password</h2>
          <p class="text-sm text-on-surface-variant mt-2">
            Enter your email to receive OTP
          </p>
        </div>

        <form id="forgotPasswordForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">Email</label>
            <input
              type="email"
              id="resetEmail"
              required
              class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors"
              placeholder="Enter your email"
            />
          </div>

          <div class="g-recaptcha" data-sitekey="6LesAA0tAAAAAMckxbDHbj54f6U8OQdmROs9HyGa"></div>

          <button
            type="submit"
            class="w-full bg-primary text-white py-3 font-semibold hover:opacity-90 transition-opacity"
          >
            Send OTP
          </button>
        </form>

        <button
          id="closeForgotModal"
          class="absolute top-4 right-4 text-on-surface-variant hover:text-primary"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="resetPasswordModal" class="modal hidden fixed inset-0 z-50 items-center justify-center">
      <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
      <div class="relative bg-surface-container-lowest p-8 max-w-md w-full mx-4 shadow-xl z-10">
        <div class="text-center mb-6">
          <h2 class="font-headline text-2xl font-bold">Set New Password</h2>
          <p class="text-sm text-on-surface-variant mt-2">
            Create a new password for your account
          </p>
        </div>

        <form id="resetPasswordForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">New Password</label>
            <input
              type="password"
              id="newPassword"
              required
              class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors"
              placeholder="Enter new password"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              required
              class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors"
              placeholder="Confirm new password"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-primary text-white py-3 font-semibold hover:opacity-90 transition-opacity"
          >
            Reset Password
          </button>
        </form>

        <button
          id="closeResetModal"
          class="absolute top-4 right-4 text-on-surface-variant hover:text-primary"
        >
          ✕
        </button>
      </div>
    </div>

    <footer class="bg-surface-container py-8">
      <div
        class="container mx-auto px-6 text-center text-xs text-on-surface-variant"
      >
        © 2000 Audi. All rights reserved.
      </div>
    </footer>

    <style>
      .modal {
        transition: all 0.3s ease;
      }

      .modal.hidden {
        display: none;
      }

      .modal:not(.hidden) {
        display: flex;
      }
    </style>

    <script>
      const BACKEND_URL =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
          ? "http://localhost:8000"
          : "https://audi-t4lu.onrender.com";

      // Global variables
      let currentEmail = "";
      let currentOtpPurpose = "";

      // Helper functions
      function setStatus(message, isError = false, allowHtml = false) {
        const statusMessage = document.getElementById("statusMessage");
        if (allowHtml) {
          statusMessage.innerHTML = message;
        } else {
          statusMessage.textContent = message;
        }
        statusMessage.className = isError
          ? "text-sm text-center min-h-[20px] text-error"
          : "text-sm text-center min-h-[20px] text-on-surface-variant";
      }

      function showModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.remove("hidden");
        document.body.style.overflow = "hidden";
      }

      function hideModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.add("hidden");
        document.body.style.overflow = "auto";
      }

      function getRecaptchaToken() {
        return new Promise((resolve) => {
          if (typeof grecaptcha !== "undefined") {
            const token = grecaptcha.getResponse();
            resolve(token);
          } else {
            resolve("");
          }
        });
      }

      function resetRecaptcha() {
        if (typeof grecaptcha !== "undefined") {
          grecaptcha.reset();
        }
      }

      // API Calls
      async function login(email, password, recaptchaToken) {
        const response = await fetch(`${BACKEND_URL}/api/user/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password, recaptchaToken }),
        });

        const data = await response.json();
        return { response, data };
      }

      async function verifyOTP(email, otp, purpose) {
        const response = await fetch(`${BACKEND_URL}/api/user/verify-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, otp, purpose }),
        });

        const data = await response.json();
        return { response, data };
      }

      async function sendOTP(email, purpose) {
        const response = await fetch(`${BACKEND_URL}/api/user/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, purpose }),
        });

        const data = await response.json();
        return { response, data };
      }

      async function resetPassword(email, otp, newPassword) {
        const response = await fetch(`${BACKEND_URL}/api/user/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, otp, newPassword }),
        });

        const data = await response.json();
        return { response, data };
      }

      async function completeLoginAfterOTP(email) {
        const response = await fetch(`${BACKEND_URL}/api/user/complete-login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email }),
        });

        const data = await response.json();
        return { response, data };
      }

      // Event Handlers
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        const recaptchaToken = await getRecaptchaToken();

        if (!recaptchaToken) {
          setStatus("Please complete the reCAPTCHA verification", true);
          return;
        }

        setStatus("Logging in...");
        
        try {
          const { response, data } = await login(email, password, recaptchaToken);
          
          if (response.ok) {
            if (data.requiresOTP) {
              currentEmail = email;
              currentOtpPurpose = "login";
              document.getElementById("otpMessage").innerHTML = 
                `Please enter the OTP sent to <strong>${email}</strong>`;
              showModal("otpModal");
              setStatus("");
              resetRecaptcha();
            } else {
              localStorage.setItem("userInfo", JSON.stringify(data));
              setStatus("Login successful! Redirecting...");
              setTimeout(() => {
                window.location.href = "index.html";
              }, 800);
            }
          } else {
            setStatus(data.message || "Login failed", true);
            resetRecaptcha();
          }
        } catch (error) {
          setStatus("Network error. Please try again.", true);
          resetRecaptcha();
        }
      });

      document.getElementById("otpForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const otp = document.getElementById("otpCode").value;
        
        if (!otp || otp.length !== 6) {
          setStatus("Please enter a valid 6-digit OTP", true);
          return;
        }
        
        setStatus("Verifying OTP...");
        
        try {
          const { response, data } = await verifyOTP(currentEmail, otp, currentOtpPurpose);
          
          if (response.ok) {
            if (currentOtpPurpose === "login") {
              // Complete login after OTP verification
              const loginResponse = await completeLoginAfterOTP(currentEmail);
              
              if (loginResponse.response.ok) {
                localStorage.setItem("userInfo", JSON.stringify(loginResponse.data));
                setStatus("Login successful! Redirecting...");
                setTimeout(() => {
                  window.location.href = "index.html";
                }, 800);
              } else {
                setStatus(loginResponse.data.message || "Login failed", true);
              }
            } else if (currentOtpPurpose === "password_reset") {
              hideModal("otpModal");
              showModal("resetPasswordModal");
              setStatus("");
            }
          } else {
            setStatus(data.message || "OTP verification failed", true);
          }
        } catch (error) {
          setStatus("Network error. Please try again.", true);
        }
      });

      document.getElementById("forgotPasswordBtn").addEventListener("click", () => {
        showModal("forgotPasswordModal");
      });

      document.getElementById("forgotPasswordForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const email = document.getElementById("resetEmail").value;
        const recaptchaToken = await getRecaptchaToken();
        
        if (!recaptchaToken) {
          setStatus("Please complete the reCAPTCHA verification", true);
          return;
        }
        
        setStatus("Sending OTP...");
        
        try {
          const { response, data } = await sendOTP(email, "password_reset");
          
          if (response.ok) {
            currentEmail = email;
            currentOtpPurpose = "password_reset";
            hideModal("forgotPasswordModal");
            document.getElementById("otpMessage").innerHTML = 
              `OTP sent to <strong>${email}</strong>. Please enter the code to reset your password.`;
            showModal("otpModal");
            setStatus("");
            resetRecaptcha();
            document.getElementById("resetEmail").value = "";
          } else {
            setStatus(data.message || "Failed to send OTP", true);
            resetRecaptcha();
          }
        } catch (error) {
          setStatus("Network error. Please try again.", true);
          resetRecaptcha();
        }
      });

      document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        
        if (newPassword !== confirmPassword) {
          setStatus("Passwords do not match", true);
          return;
        }
        
        if (newPassword.length < 6) {
          setStatus("Password must be at least 6 characters", true);
          return;
        }
        
        setStatus("Resetting password...");
        
        // Get OTP from the OTP modal input
        const otp = document.getElementById("otpCode").value;
        
        if (!otp || otp.length !== 6) {
          setStatus("Please enter the OTP code first", true);
          hideModal("resetPasswordModal");
          showModal("otpModal");
          return;
        }
        
        try {
          const { response, data } = await resetPassword(currentEmail, otp, newPassword);
          
          if (response.ok) {
            setStatus("Password reset successful! You can now login.");
            setTimeout(() => {
              hideModal("resetPasswordModal");
              hideModal("otpModal");
              document.getElementById("loginForm").reset();
              document.getElementById("otpCode").value = "";
              document.getElementById("newPassword").value = "";
              document.getElementById("confirmPassword").value = "";
              setStatus("");
            }, 2000);
          } else {
            setStatus(data.message || "Password reset failed", true);
          }
        } catch (error) {
          setStatus("Network error. Please try again.", true);
        }
      });

      // Close modals
      document.getElementById("closeOtpModal").addEventListener("click", () => {
        hideModal("otpModal");
        document.getElementById("otpCode").value = "";
      });
      
      document.getElementById("closeForgotModal").addEventListener("click", () => {
        hideModal("forgotPasswordModal");
        document.getElementById("resetEmail").value = "";
        resetRecaptcha();
      });
      
      document.getElementById("closeResetModal").addEventListener("click", () => {
        hideModal("resetPasswordModal");
        document.getElementById("newPassword").value = "";
        document.getElementById("confirmPassword").value = "";
      });

      // Close modals when clicking overlay
      document.querySelectorAll(".modal-overlay").forEach(overlay => {
        overlay.addEventListener("click", () => {
          hideModal("otpModal");
          hideModal("forgotPasswordModal");
          hideModal("resetPasswordModal");
          document.getElementById("otpCode").value = "";
          document.getElementById("resetEmail").value = "";
          document.getElementById("newPassword").value = "";
          document.getElementById("confirmPassword").value = "";
          resetRecaptcha();
        });
      });

      // Resend OTP
      document.getElementById("resendOtpBtn").addEventListener("click", async () => {
        if (!currentEmail) return;
        
        setStatus("Resending OTP...");
        
        try {
          const { response, data } = await sendOTP(currentEmail, currentOtpPurpose);
          if (response.ok) {
            setStatus("New OTP sent successfully!");
            setTimeout(() => setStatus(""), 3000);
          } else {
            setStatus(data.message || "Failed to resend OTP", true);
          }
        } catch (error) {
          setStatus("Network error. Please try again.", true);
        }
      });

      // Initial reCAPTCHA render
      window.onload = function() {
        setStatus("");
      };
    </script>
  </body>
</html>
