<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audi | Login</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#dfe3e5",
              "on-secondary-container": "#616567",
              "surface-container-highest": "#e2e2e2",
              "secondary-fixed": "#dfe3e5",
              "inverse-surface": "#2f3131",
              "surface-dim": "#dadada",
              error: "#ba1a1a",
              "surface-container-high": "#e8e8e8",
              "primary-fixed-dim": "#c6c6c6",
              "on-surface": "#1a1c1c",
              outline: "#7e7576",
              "on-error": "#ffffff",
              "on-secondary-fixed": "#181c1e",
              "on-background": "#1a1c1c",
              "on-tertiary": "#ffffff",
              "tertiary-fixed-dim": "#ffb3b3",
              "error-container": "#ffdad6",
              "on-surface-variant": "#4c4546",
              "surface-container-lowest": "#ffffff",
              "surface-variant": "#e2e2e2",
              "surface-bright": "#f9f9f9",
              "secondary-fixed-dim": "#c3c7c9",
              surface: "#f9f9f9",
              "on-primary-container": "#848484",
              "inverse-primary": "#c6c6c6",
              "surface-tint": "#5e5e5e",
              "primary-fixed": "#e2e2e2",
              background: "#f9f9f9",
              "on-secondary": "#ffffff",
              "on-primary": "#ffffff",
              "outline-variant": "#cfc4c5",
              "on-primary-fixed-variant": "#474747",
              "on-tertiary-fixed-variant": "#920022",
              "surface-container": "#eeeeee",
              "on-error-container": "#93000a",
              "tertiary-container": "#400009",
              "on-tertiary-fixed": "#400009",
              "on-secondary-fixed-variant": "#434749",
              secondary: "#5b5f61",
              primary: "#000000",
              "on-tertiary-container": "#f33d52",
              "primary-container": "#1b1b1b",
              "surface-container-low": "#f3f3f3",
              "inverse-on-surface": "#f1f1f1",
              "tertiary-fixed": "#ffdad9",
              tertiary: "#000000",
              "on-primary-fixed": "#1b1b1b",
            },
            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
          },
        },
      };
    </script>

    <style>
      .glass-header {
        background: rgba(243, 243, 243, 0.8);
        backdrop-filter: blur(24px);
      }

      .password-wrapper {
        position: relative;
      }

      .password-wrapper input {
        padding-right: 45px;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        user-select: none;
        color: #666;
        transition: color 0.2s;
      }

      .toggle-password:hover {
        color: #000;
      }

      .modal {
        transition: all 0.3s ease;
      }

      .modal.hidden {
        display: none;
      }

      .modal:not(.hidden) {
        display: flex;
      }

      .modal-status {
        transition: all 0.3s ease;
      }
    </style>
  </head>

  <body
    class="bg-surface text-on-surface font-body selection:bg-primary selection:text-white min-h-screen flex flex-col"
    style="background-image: url('https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?q=80&w=2069&auto=format&fit=crop'); background-size: cover; background-position: center;"
  >
    <header
      class="glass-header sticky top-0 z-50 border-b border-outline-variant/10"
    >
      <nav
        class="container mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-12">
          <a
            href="index.html"
            class="font-headline text-2xl font-extrabold tracking-tighter text-black"
          >
            Audi
          </a>
        </div>

        <div class="flex items-center gap-6">
          <a
            class="text-sm font-semibold hover:opacity-70 transition-opacity text-black"
            href="register.html"
          >
            Register
          </a>
        </div>
      </nav>
    </header>

    <main class="flex-grow flex items-center justify-center py-16">
      <div class="container max-w-md mx-auto px-6">
        <div class="bg-white/95 backdrop-blur-sm p-8 md:p-10 shadow-xl rounded-lg">
          <div class="text-center mb-8">
            <h1 class="font-headline text-3xl font-bold tracking-tight mb-2">
              Welcome Back
            </h1>
            <p class="text-sm text-on-surface-variant">
              Sign in to your Audi account
            </p>
          </div>

          <!-- Email Login Form -->
          <form id="loginForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-2">Email</label>
              <input
                type="email"
                id="loginEmail"
                required
                class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors rounded-lg"
                placeholder="Enter your email"
              />
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="loginPassword"
                  required
                  class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors rounded-lg"
                  placeholder="Enter your password"
                />
                <span class="toggle-password" onclick="togglePassword('loginPassword')">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                  </svg>
                </span>
              </div>
            </div>

            <div class="text-right">
              <button
                type="button"
                id="forgotPasswordBtn"
                class="text-sm text-primary hover:underline"
              >
                Forgot Password?
              </button>
            </div>

            <button
              type="submit"
              class="w-full bg-primary text-white py-3 font-semibold hover:opacity-90 transition-opacity rounded-lg"
            >
              Sign In
            </button>
          </form>

          <div id="statusMessageWrap" class="min-h-[24px] mt-4">
            <p
              id="statusMessage"
              class="text-sm text-center min-h-[20px] text-on-surface-variant"
            ></p>
          </div>

          <p class="text-center text-sm text-on-surface-variant mt-8">
            Don't have an account?
            <a
              href="register.html"
              class="font-bold text-primary hover:underline"
            >
              Register
            </a>
          </p>
        </div>
      </div>
    </main>

    <!-- OTP Modal -->
    <div id="otpModal" class="modal hidden fixed inset-0 z-50 items-center justify-center">
      <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
      <div class="relative bg-white rounded-xl p-8 max-w-md w-full mx-4 shadow-xl z-10">
        <div class="text-center mb-6">
          <h2 class="font-headline text-2xl font-bold">Verify OTP</h2>
          <p class="text-sm text-on-surface-variant mt-2" id="otpMessage">
            Please enter the OTP sent to your email
          </p>
        </div>

        <form id="otpForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">OTP Code</label>
            <input
              type="text"
              id="otpCode"
              required
              maxlength="6"
              class="w-full px-4 py-3 text-center text-2xl tracking-widest border border-outline-variant focus:border-primary focus:outline-none transition-colors rounded-lg"
              placeholder="000000"
            />
          </div>

          <div id="otpModalStatus" class="min-h-[40px]">
            <p class="text-sm text-center text-on-surface-variant"></p>
          </div>

          <button
            type="submit"
            class="w-full bg-primary text-white py-3 font-semibold hover:opacity-90 transition-opacity rounded-lg"
          >
            Verify OTP
          </button>

          <button
            type="button"
            id="resendOtpBtn"
            class="w-full text-sm text-primary hover:underline"
          >
            Resend OTP
          </button>
        </form>

        <button
          id="closeOtpModal"
          class="absolute top-4 right-4 text-on-surface-variant hover:text-primary"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal hidden fixed inset-0 z-50 items-center justify-center">
      <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
      <div class="relative bg-white rounded-xl p-8 max-w-md w-full mx-4 shadow-xl z-10">
        <div class="text-center mb-6">
          <h2 class="font-headline text-2xl font-bold">Reset Password</h2>
          <p class="text-sm text-on-surface-variant mt-2">
            Enter your email to receive OTP
          </p>
        </div>

        <form id="forgotPasswordForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">Email</label>
            <input
              type="email"
              id="resetEmail"
              required
              class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors rounded-lg"
              placeholder="Enter your email"
            />
          </div>

          <div id="forgotModalStatus" class="min-h-[40px]">
            <p class="text-sm text-center text-on-surface-variant"></p>
          </div>

          <button
            type="submit"
            class="w-full bg-primary text-white py-3 font-semibold hover:opacity-90 transition-opacity rounded-lg"
          >
            Send OTP
          </button>
        </form>

        <button
          id="closeForgotModal"
          class="absolute top-4 right-4 text-on-surface-variant hover:text-primary"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="resetPasswordModal" class="modal hidden fixed inset-0 z-50 items-center justify-center">
      <div class="modal-overlay absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
      <div class="relative bg-white rounded-xl p-8 max-w-md w-full mx-4 shadow-xl z-10">
        <div class="text-center mb-6">
          <h2 class="font-headline text-2xl font-bold">Set New Password</h2>
          <p class="text-sm text-on-surface-variant mt-2">
            Create a new password for your account
          </p>
        </div>

        <form id="resetPasswordForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">New Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="newPassword"
                required
                class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors rounded-lg"
                placeholder="Enter new password"
              />
              <span class="toggle-password" onclick="togglePassword('newPassword')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </span>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Confirm Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                required
                class="w-full px-4 py-3 border border-outline-variant focus:border-primary focus:outline-none transition-colors rounded-lg"
                placeholder="Confirm new password"
              />
              <span class="toggle-password" onclick="togglePassword('confirmPassword')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </span>
            </div>
          </div>

          <div id="resetModalStatus" class="min-h-[40px]">
            <p class="text-sm text-center text-on-surface-variant"></p>
          </div>

          <button
            type="submit"
            class="w-full bg-primary text-white py-3 font-semibold hover:opacity-90 transition-opacity rounded-lg"
          >
            Reset Password
          </button>
        </form>

        <button
          id="closeResetModal"
          class="absolute top-4 right-4 text-on-surface-variant hover:text-primary"
        >
          ✕
        </button>
      </div>
    </div>

    <footer class="bg-black/50 backdrop-blur-sm py-8 mt-auto">
      <div
        class="container mx-auto px-6 text-center text-xs text-white"
      >
        © 2025 Audi. All rights reserved.
      </div>
    </footer>

    <script>
      const BACKEND_URL =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
          ? "http://localhost:8000"
          : "https://audi-t4lu.onrender.com";

      // Global variables
      let currentEmail = "";
      let currentOtpPurpose = "";

      // Toggle password visibility
      window.togglePassword = function(fieldId) {
        const field = document.getElementById(fieldId);
        const type = field.getAttribute("type") === "password" ? "text" : "password";
        field.setAttribute("type", type);
        
        // Change icon
        const icon = field.parentElement.querySelector('svg');
        if (type === "text") {
          icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
          `;
        } else {
          icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
          `;
        }
      };

      // Helper functions for modal status messages
      function setModalStatus(modalId, message, isError = false) {
        const statusDiv = document.getElementById(modalId);
        if (statusDiv) {
          const p = statusDiv.querySelector('p');
          p.textContent = message;
          p.className = isError
            ? "text-sm text-center text-error"
            : "text-sm text-center text-green-600";
          
          // Auto clear after 3 seconds for success messages
          if (!isError) {
            setTimeout(() => {
              if (p.textContent === message) {
                p.textContent = "";
              }
            }, 3000);
          }
        }
      }

      function clearModalStatus(modalId) {
        const statusDiv = document.getElementById(modalId);
        if (statusDiv) {
          const p = statusDiv.querySelector('p');
          p.textContent = "";
        }
      }

      function setMainStatus(message, isError = false, allowHtml = false) {
        const statusMessage = document.getElementById("statusMessage");
        if (allowHtml) {
          statusMessage.innerHTML = message;
        } else {
          statusMessage.textContent = message;
        }
        statusMessage.className = isError
          ? "text-sm text-center min-h-[20px] text-error"
          : "text-sm text-center min-h-[20px] text-on-surface-variant";
      }

      function showModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.remove("hidden");
        document.body.style.overflow = "hidden";
        // Clear status when opening modal
        if (modalId === "otpModal") clearModalStatus("otpModalStatus");
        if (modalId === "forgotPasswordModal") clearModalStatus("forgotModalStatus");
        if (modalId === "resetPasswordModal") clearModalStatus("resetModalStatus");
      }

      function hideModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.add("hidden");
        document.body.style.overflow = "auto";
      }

      // API Calls
      async function login(email, password) {
        const response = await fetch(`${BACKEND_URL}/api/user/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();
        return { response, data };
      }

      async function verifyOTP(email, otp, purpose) {
        const response = await fetch(`${BACKEND_URL}/api/user/verify-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, otp, purpose }),
        });

        const data = await response.json();
        return { response, data };
      }

      async function sendOTP(email, purpose) {
        const response = await fetch(`${BACKEND_URL}/api/user/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, purpose }),
        });

        const data = await response.json();
        return { response, data };
      }

      async function resetPassword(email, newPassword) {
        const response = await fetch(`${BACKEND_URL}/api/user/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, newPassword }),
        });

        const data = await response.json();
        return { response, data };
      }

      async function checkEmailExists(email) {
        const response = await fetch(`${BACKEND_URL}/api/user/check-email`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email }),
        });
        
        const data = await response.json();
        return { response, data };
      }

      // Event Handlers
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        if (!email || !password) {
          setMainStatus("Please enter both email and password", true);
          return;
        }

        setMainStatus("Logging in...");
        
        try {
          const { response, data } = await login(email, password);
          
          if (response.ok) {
            if (data.requiresOTP) {
              currentEmail = email;
              currentOtpPurpose = "login";
              document.getElementById("otpMessage").innerHTML = 
                `Please enter the OTP sent to <strong>${email}</strong>`;
              showModal("otpModal");
              setMainStatus("");
            } else {
              localStorage.setItem("userInfo", JSON.stringify(data));
              setMainStatus("Login successful! Redirecting...");
              setTimeout(() => {
                window.location.href = "index.html";
              }, 800);
            }
          } else {
            setMainStatus(data.message || "Login failed", true);
          }
        } catch (error) {
          setMainStatus("Network error. Please try again.", true);
        }
      });

      document.getElementById("otpForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const otp = document.getElementById("otpCode").value;
        
        if (!otp || otp.length !== 6) {
          setModalStatus("otpModalStatus", "Please enter a valid 6-digit OTP", true);
          return;
        }
        
        setModalStatus("otpModalStatus", "Verifying OTP...", false);
        
        try {
          const { response, data } = await verifyOTP(currentEmail, otp, currentOtpPurpose);
          
          if (response.ok) {
            if (currentOtpPurpose === "login") {
              localStorage.setItem("userInfo", JSON.stringify(data));
              setModalStatus("otpModalStatus", "Login successful! Redirecting...", false);
              setTimeout(() => {
                window.location.href = "index.html";
              }, 800);
            } else if (currentOtpPurpose === "password_reset") {
              hideModal("otpModal");
              showModal("resetPasswordModal");
              document.getElementById("otpCode").value = "";
            }
          } else {
            setModalStatus("otpModalStatus", data.message || "OTP verification failed", true);
          }
        } catch (error) {
          setModalStatus("otpModalStatus", "Network error. Please try again.", true);
        }
      });

      document.getElementById("forgotPasswordBtn").addEventListener("click", () => {
        showModal("forgotPasswordModal");
      });

      document.getElementById("forgotPasswordForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const email = document.getElementById("resetEmail").value;
        
        if (!email) {
          setModalStatus("forgotModalStatus", "Please enter your email", true);
          return;
        }
        
        setModalStatus("forgotModalStatus", "Checking email...", false);
        
        try {
          // First check if email exists
          const { response: checkResponse, data: checkData } = await checkEmailExists(email);
          
          if (!checkResponse.ok) {
            setModalStatus("forgotModalStatus", checkData.message || "Email not found. Please register first.", true);
            return;
          }
          
          // Email exists, send OTP
          setModalStatus("forgotModalStatus", "Sending OTP...", false);
          const { response, data } = await sendOTP(email, "password_reset");
          
          if (response.ok) {
            currentEmail = email;
            currentOtpPurpose = "password_reset";
            hideModal("forgotPasswordModal");
            document.getElementById("otpMessage").innerHTML = 
              `OTP sent to <strong>${email}</strong>. Please enter the code to reset your password.`;
            showModal("otpModal");
            document.getElementById("resetEmail").value = "";
          } else {
            setModalStatus("forgotModalStatus", data.message || "Failed to send OTP", true);
          }
        } catch (error) {
          setModalStatus("forgotModalStatus", "Network error. Please try again.", true);
        }
      });

      document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        
        if (newPassword !== confirmPassword) {
          setModalStatus("resetModalStatus", "Passwords do not match", true);
          return;
        }
        
        if (newPassword.length < 6) {
          setModalStatus("resetModalStatus", "Password must be at least 6 characters", true);
          return;
        }
        
        setModalStatus("resetModalStatus", "Resetting password...", false);
        
        try {
          const { response, data } = await resetPassword(currentEmail, newPassword);
          
          if (response.ok) {
            setModalStatus("resetModalStatus", "Password reset successful! You can now login.", false);
            setTimeout(() => {
              hideModal("resetPasswordModal");
              document.getElementById("newPassword").value = "";
              document.getElementById("confirmPassword").value = "";
              setMainStatus("Password reset successful! Please login with your new password.");
            }, 2000);
          } else {
            setModalStatus("resetModalStatus", data.message || "Password reset failed", true);
          }
        } catch (error) {
          setModalStatus("resetModalStatus", "Network error. Please try again.", true);
        }
      });

      // Close modals
      document.getElementById("closeOtpModal").addEventListener("click", () => {
        hideModal("otpModal");
        document.getElementById("otpCode").value = "";
        clearModalStatus("otpModalStatus");
      });
      
      document.getElementById("closeForgotModal").addEventListener("click", () => {
        hideModal("forgotPasswordModal");
        document.getElementById("resetEmail").value = "";
        clearModalStatus("forgotModalStatus");
      });
      
      document.getElementById("closeResetModal").addEventListener("click", () => {
        hideModal("resetPasswordModal");
        document.getElementById("newPassword").value = "";
        document.getElementById("confirmPassword").value = "";
        clearModalStatus("resetModalStatus");
      });

      // Close modals when clicking overlay
      document.querySelectorAll(".modal-overlay").forEach(overlay => {
        overlay.addEventListener("click", () => {
          hideModal("otpModal");
          hideModal("forgotPasswordModal");
          hideModal("resetPasswordModal");
          document.getElementById("otpCode").value = "";
          document.getElementById("resetEmail").value = "";
          document.getElementById("newPassword").value = "";
          document.getElementById("confirmPassword").value = "";
          clearModalStatus("otpModalStatus");
          clearModalStatus("forgotModalStatus");
          clearModalStatus("resetModalStatus");
        });
      });

      // Resend OTP
      document.getElementById("resendOtpBtn").addEventListener("click", async () => {
        if (!currentEmail) return;
        
        setModalStatus("otpModalStatus", "Resending OTP...", false);
        
        try {
          const { response, data } = await sendOTP(currentEmail, currentOtpPurpose);
          if (response.ok) {
            setModalStatus("otpModalStatus", "New OTP sent successfully!", false);
          } else {
            setModalStatus("otpModalStatus", data.message || "Failed to resend OTP", true);
          }
        } catch (error) {
          setModalStatus("otpModalStatus", "Network error. Please try again.", true);
        }
      });

      // Initial load
      window.onload = function() {
        setMainStatus("");
      };
    </script>
  </body>
</html>
