<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audi | Login</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <!-- 1. The Ultimate Fallback (Placed first for old browsers) -->
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />

    <!-- 2. Modern Browsers & High-Res Screens -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon-16x16.png"
    />

    <!-- 3. Apple Devices -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/apple-touch-icon.png"
    />

    <!-- 4. PWA / Android / Windows -->
    <link rel="manifest" href="images/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#dfe3e5",
              "on-secondary-container": "#616567",
              "surface-container-highest": "#e2e2e2",
              "secondary-fixed": "#dfe3e5",
              "inverse-surface": "#2f3131",
              "surface-dim": "#dadada",
              error: "#ba1a1a",
              "surface-container-high": "#e8e8e8",
              "primary-fixed-dim": "#c6c6c6",
              "on-surface": "#1a1c1c",
              outline: "#7e7576",
              "on-error": "#ffffff",
              "on-secondary-fixed": "#181c1e",
              "on-background": "#1a1c1c",
              "on-tertiary": "#ffffff",
              "tertiary-fixed-dim": "#ffb3b3",
              "error-container": "#ffdad6",
              "on-surface-variant": "#4c4546",
              "surface-container-lowest": "#ffffff",
              "surface-variant": "#e2e2e2",
              "surface-bright": "#f9f9f9",
              "secondary-fixed-dim": "#c3c7c9",
              surface: "#f9f9f9",
              "on-primary-container": "#848484",
              "inverse-primary": "#c6c6c6",
              "surface-tint": "#5e5e5e",
              "primary-fixed": "#e2e2e2",
              background: "#f9f9f9",
              "on-secondary": "#ffffff",
              "on-primary": "#ffffff",
              "outline-variant": "#cfc4c5",
              "on-primary-fixed-variant": "#474747",
              "on-tertiary-fixed-variant": "#920022",
              "surface-container": "#eeeeee",
              "on-error-container": "#93000a",
              "tertiary-container": "#400009",
              "on-tertiary-fixed": "#400009",
              "on-secondary-fixed-variant": "#434749",
              secondary: "#5b5f61",
              primary: "#000000",
              "on-tertiary-container": "#f33d52",
              "primary-container": "#1b1b1b",
              "surface-container-low": "#f3f3f3",
              "inverse-on-surface": "#f1f1f1",
              "tertiary-fixed": "#ffdad9",
              tertiary: "#000000",
              "on-primary-fixed": "#1b1b1b",
            },
            fontFamily: {
              headline: ["Manrope"],
              body: ["Inter"],
              label: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
          },
        },
      };
    </script>

    <style>
      .glass-header {
        background: rgba(243, 243, 243, 0.8);
        backdrop-filter: blur(24px);
      }

      .social-login-btn {
        transition: all 0.2s ease;
      }

      .social-login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>

  <body
    class="bg-surface text-on-surface font-body selection:bg-primary selection:text-white min-h-screen flex flex-col"
  >
    <header
      class="glass-header sticky top-0 z-50 border-b border-outline-variant/10"
    >
      <nav
        class="container mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-12">
          <a
            href="index.html"
            class="font-headline text-2xl font-extrabold tracking-tighter"
          >
            Audi
          </a>
        </div>

        <div class="flex items-center gap-6">
          <a
            class="text-sm font-semibold hover:opacity-70 transition-opacity"
            href="register.html"
          >
            Register
          </a>
        </div>
      </nav>
    </header>

    <main class="flex-grow flex items-center justify-center py-16">
      <div class="container max-w-md mx-auto px-6">
        <div class="bg-surface-container-lowest p-8 md:p-10 shadow-sm">
          <div class="text-center mb-8">
            <h1 class="font-headline text-3xl font-bold tracking-tight mb-2">
              Welcome Back
            </h1>
            <p class="text-sm text-on-surface-variant">
              Sign in to your Audi account
            </p>
          </div>

          <form id="loginForm" class="space-y-5">
            <div>
              <label
                for="email"
                class="block text-xs font-bold tracking-widest uppercase mb-2"
              >
                Email
              </label>
              <input
                type="email"
                id="email"
                class="w-full px-4 py-3 border border-outline-variant bg-transparent focus:border-primary focus:ring-0 transition-colors"
                placeholder="Enter email address"
              />
            </div>

            <div>
              <label
                for="password"
                class="block text-xs font-bold tracking-widest uppercase mb-2"
              >
                Password
              </label>

              <div class="relative">
                <input
                  type="password"
                  id="password"
                  class="w-full px-4 py-3 pr-12 border border-outline-variant bg-transparent focus:border-primary focus:ring-0 transition-colors"
                  placeholder="Enter password"
                />

                <button
                  type="button"
                  class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary"
                  data-target="password"
                  aria-label="Show password"
                >
                  <i data-lucide="eye" class="w-5 h-5"></i>
                </button>
              </div>
            </div>

            <p
              id="statusMessage"
              class="text-sm text-center min-h-[20px] text-on-surface-variant"
            ></p>

            <button
              id="loginBtn"
              type="submit"
              class="w-full bg-primary text-on-primary py-4 font-bold text-sm tracking-widest hover:bg-primary-container transition-colors"
            >
              LOGIN
            </button>
          </form>

          <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-outline-variant/30"></div>
            </div>
          </div>

          <p class="text-center text-sm text-on-surface-variant mt-8">
            Don't have an account?
            <a
              href="register.html"
              class="font-bold text-primary hover:underline"
            >
              Register
            </a>
          </p>
        </div>
      </div>
    </main>

    <footer class="bg-surface-container py-8">
      <div
        class="container mx-auto px-6 text-center text-xs text-on-surface-variant"
      >
        © 2000 Audi. All rights reserved.
      </div>
    </footer>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      const BACKEND_URL =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
          ? "http://localhost:8000"
          : "https://audi-t4lu.onrender.com";

      const loginForm = document.getElementById("loginForm");
      const loginBtn = document.getElementById("loginBtn");
      const statusMessage = document.getElementById("statusMessage");

      function setStatus(message, isError = false) {
        statusMessage.textContent = message;
        statusMessage.className = isError
          ? "text-sm text-center min-h-[20px] text-error"
          : "text-sm text-center min-h-[20px] text-on-surface-variant";
      }

      function setLoading(isLoading) {
        loginBtn.disabled = isLoading;
        loginBtn.textContent = isLoading ? "PLEASE WAIT..." : "LOGIN";

        loginBtn.classList.toggle("opacity-70", isLoading);
        loginBtn.classList.toggle("cursor-not-allowed", isLoading);
      }

      function initPasswordToggles() {
        document.querySelectorAll(".password-toggle").forEach((button) => {
          button.addEventListener("click", function () {
            const targetId = button.getAttribute("data-target");
            const input = document.getElementById(targetId);

            if (!input) return;

            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";

            button.innerHTML = isHidden
              ? `<i data-lucide="eye-off" class="w-5 h-5"></i>`
              : `<i data-lucide="eye" class="w-5 h-5"></i>`;

            button.setAttribute(
              "aria-label",
              isHidden ? "Hide password" : "Show password",
            );

            lucide.createIcons();
          });
        });

        lucide.createIcons();
      }

      async function checkBackend() {
        const response = await fetch(`${BACKEND_URL}/api/health`);

        if (!response.ok) {
          throw new Error("Backend is not reachable");
        }
      }

      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          setStatus("Email and password are required.", true);
          return;
        }

        try {
          setLoading(true);
          setStatus("Signing you in...");

          const response = await fetch(`${BACKEND_URL}/api/user/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({
              email,
              password,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Login failed");
          }

          localStorage.setItem("userInfo", JSON.stringify(data));

          setStatus("Login successful. Redirecting...");

          setTimeout(() => {
            window.location.href = "index.html";
          }, 800);
        } catch (error) {
          setStatus(error.message || "Login failed", true);
        } finally {
          setLoading(false);
        }
      });

      window.addEventListener("load", async function () {
        initPasswordToggles();
        setStatus("Loading...");

        try {
          await checkBackend();
          setStatus("Enter your email and password to continue.");
        } catch (error) {
          setStatus("Cannot reach backend. Make sure server is running.", true);
        }
      });
    </script>
  </body>
</html>
